- name: Setup system.
  hosts: localhost
  become: true
  connection: local
  gather_facts: true

  tasks:
# Apt and prerequisites
    - name: Install prerequisites.
      apt:
        name:
          - make
          - gnupg
          - ca-certificates
          - curl
          - wget
        state: present

    - name: Install all apt packages.
      apt:
        update_cache: true
        state: present
        name:
          - git
          - vim
          - btop
          - pulsemixer
          - python3
          - gcc
          - figlet
          - lolcat
        # - fastfetch
        # - mpd

# Nushell
    - name: Check whether nushell is installed.
      ansible.builtin.stat:
        path: /usr/bin/nu
      register: nushell_bin
    - name: Install nushell.
      when: not nushell_bin.stat.exists
      block:
        - name: Remove old Nushell repo.
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/fury.list
            state: absent
        - name: Add Nushell GPG key.
          ansible.builtin.get_url:
            url: https://apt.fury.io/nushell/gpg.key
            dest: /etc/apt/keyrings/fury-nushell.gpg.key
            mode: '0644'
        - name: Dearmor Nushell GPG key.
          ansible.builtin.command:
            cmd: gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg /etc/apt/keyrings/fury-nushell.gpg.key
            creates: /etc/apt/keyrings/fury-nushell.gpg
        - name: Add Nushell repo.
          ansible.builtin.apt_repository:
            repo: "deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /"
            filename: fury-nushell
            state: present
        - name: Install Nushell.
          ansible.builtin.apt:
            update_cache: true
            name: nushell
            state: present
    - name: Set Nushell as a default shell for kubamike.
      user:
        name: kubamike
        shell: /usr/bin/nu

# Musikcube
    - name: Check if musikcube exists.
      ansible.builtin.stat:
        path: /usr/bin/musikcube
      register: musikcube_bin

    - name: Install musikcube.
      when: not musikcube_bin.stat.exists
      ansible.builtin.apt:
        deb: "{{
          (lookup('url', 'https://api.github.com/repos/clangen/musikcube/releases/latest') | from_json).assets
          | selectattr('name', 'search', 'x86_64.deb')
          | map(attribute='browser_download_url')
          | first
        }}"

# Superfile
    - name: Check if superfile exists.
      ansible.builtin.stat:
        path: /usr/local/bin/spf
      register: superfile_bin
    - name: Install superfile.
      when: not superfile_bin.stat.exists
      ansible.builtin.shell: curl -sLo- https://superfile.dev/install.sh | bash

# Zellij
    - name: Check if zellij exists.
      ansible.builtin.stat:
        path: /usr/local/bin/zellij
      register: zellij_bin
    - name: Install zellij.
      when: not zellij_bin.stat.exists
      block:
        - name: Get zellij tarball to /tmp.
          ansible.builtin.get_url:
            url: https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz
            dest: /tmp/zellij.tar.gz
            mode: '0644'
          register: zellij_download
        - name: Install zellij to /usr/local/bin/zellij.
          ansible.builtin.unarchive:
            src: /tmp/zellij.tar.gz
            dest: /usr/local/bin/
            remote_src: yes
# Neovim
    - name: Check if Neovim exists.
      stat:
        path: /opt/nvim-linux-x86_64/bin/nvim
      register: neovim_bin
    - name: Install Neovim.
      when: not neovim_bin.stat.exists
      block:
        - name: Download Neovim binary.
          get_url: 
            url: https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
            path: /tmp/nvim-linux-x86_64.tar.gz
            mode: '644'
        - name: Remove existing Neovim instalation.
          file:
            path: /opt/nvim-linux-x86_64
            state: absent
        - name: Extract Neovim to /opt
          unarchive:
            src: /tmp/nvim-linux-x86_64.tar.gz
            dest: /opt
            remote_src: yes

